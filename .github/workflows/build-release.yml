name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable
      run: |
        pyinstaller build.spec --clean
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-Windows
        path: dist/ScreenTranslator.exe
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/ScreenTranslator.exe
        body: |
          ## Screen Translator ${{ github.ref_name }}
          
          ### Installation
          1. Download `ScreenTranslator.exe` below
          2. Install Windows Japanese OCR (run as Administrator):
             ```powershell
             Add-WindowsCapability -Online -Name "Language.OCR~~~ja-JP~0.0.1.0"
             ```
          3. Run `ScreenTranslator.exe`
          
          ### Features
          - English ↔ Japanese screen translation
          - Windows OCR for accurate text recognition
          - Ctrl+Shift+C keyboard shortcut
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
